name: Deploy Python App to GCP VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to GCP VM
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: 136.113.30.59
          username: shritelang1234
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22

          script: |
            # Create application directory if it doesn't exist
            mkdir -p ~/application
            cd ~/application

            # Initialize git repository if not already initialized
            if [ ! -d ".git" ]; then
              git init
              git remote add origin https://github.com/shritelang1234/application.git
              git fetch
              git reset --hard origin/main
            else
              git pull origin main
            fi

            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi

            source venv/bin/activate

            pip install -r requirements.txt

            pkill -f app.py || true

            # Start the Flask app
            nohup python3 app.py > app.log 2>&1 &

            # Give the app a moment to start
            sleep 3

            # Check if the app is running and listening on port 5000
            if netstat -tlnp | grep :5000 > /dev/null; then
              echo "Flask app is running and listening on port 5000"
            else
              echo "WARNING: Flask app may not be running properly"
              echo "Checking app.log for errors:"
              tail -20 app.log
            fi